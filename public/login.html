<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - TeamSim</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { max-width: 320px; }
    label { display:block; margin-top: 8px; }
    input[type="text"], input[type="password"] { width:100%; padding:8px; }
    button { margin-top:12px; padding:8px 12px; }
    .msg { margin-top:12px; color: green; }
    .err { margin-top:12px; color: red; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required />
    <button type="submit">Sign in</button>
  </form>
  <div id="status"></div>

  <script>
    // client-side login handler
    const form = document.getElementById('loginForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        status.className = 'err';
        status.textContent = 'Please enter username and password.';
        return;
      }

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (resp.ok) {
          status.className = 'msg';
          status.textContent = 'Login successful: ' + (data.message || '');
        } else {
          status.className = 'err';
          status.textContent = 'Login failed: ' + (data.error || 'Invalid credentials');
        }
      } catch (err) {
        status.className = 'err';
        status.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
</body>
</html>
